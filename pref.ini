[custom]

; 不测速
enable_rule_generator=true
overwrite_original_rules=true

; ===== 策略组 =====

custom_proxy_group=手动选择`select`[]香港`[]台湾`[]日本`[]新加坡`[]韩国`[]美国`[]其它国家`[]全部节点`[]DIRECT

custom_proxy_group=GPT`select`[]日本`[]新加坡`[]美国`[]香港`[]手动选择
custom_proxy_group=Telegram`select`[]香港`[]新加坡`[]日本`[]美国`[]手动选择
custom_proxy_group=YouTube`select`[]香港`[]台湾`[]日本`[]新加坡`[]美国`[]手动选择
custom_proxy_group=Github`select`[]DIRECT`[]手动选择`[]香港`[]日本`[]新加坡`[]美国
custom_proxy_group=EMBY`select`[]DIRECT`[]手动选择`[]香港`[]台湾`[]日本`[]新加坡
custom_proxy_group=哔哩哔哩`select`[]DIRECT`[]香港`[]台湾

custom_proxy_group=国外网站`select`[]手动选择`[]香港`[]日本`[]新加坡`[]美国`[]其它国家
custom_proxy_group=国内网站`select`[]DIRECT`[]手动选择
custom_proxy_group=兜底`select`[]手动选择`[]DIRECT

; ===== 地区组 =====

custom_proxy_group=香港`url-test`(港|HK|hk|Hong Kong|HongKong)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=台湾`url-test`(台|TW|tw|Taiwan)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=日本`url-test`(日|JP|jp|Japan)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=韩国`url-test`(韩|KR|kr|Korea)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=美国`url-test`(美|US|us|United States)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=新加坡`url-test`(新|SG|sg|Singapore)`https://www.gstatic.com/generate_204`300,,50

custom_proxy_group=其它国家`select`^(?!.*(港|HK|hk|台|TW|tw|日|JP|jp|韩|KR|kr|美|US|us|新|SG|sg|流量|到期|官网)).*$

custom_proxy_group=全部节点`select`.*

; ===== 规则 =====

ruleset=GPT,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list
ruleset=Telegram,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.list
ruleset=YouTube,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list
ruleset=Github,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.list
ruleset=EMBY,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Emby/Emby.list
ruleset=哔哩哔哩,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Bilibili/Bilibili.list

ruleset=国内网站,[]GEOIP,CN
ruleset=国内网站,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMax/ChinaMax.list

ruleset=国外网站,[]FINAL

; ===== 其它 =====


emoji=true
udp=true
tcp-fast-open=true
skip-cert-verify=true
sort=true
append_type=true


